version: '3.8'

services:
  database:
    image: postgres:15
    environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
    container_name: database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 15s
      timeout: 30s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped
    networks: 
      - mynet

  api:
    build: ./FinanceManager
    container_name: api
    restart: always
    env_file:
      - .env
    ports:
      - 8000:8000
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks: 
      - mynet

  nginx:
    image: nginx:1.25
    container_name: nginx
    expose:
      - 6534
    ports:
      - 6534:6534
    restart: unless-stopped
    volumes:
      - ./nginx/financemanager.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      database:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: 
      - mynet

volumes:
  db_data:

networks:
  mynet: 
    driver: bridge

